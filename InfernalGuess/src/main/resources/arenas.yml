# ============================================================
#  arenas.yml · 竞技场与点位
#
#  ⚠️ 本文件由 /ig arena ... 调试指令与调试 UI 自动维护，
#     **不需要手工编辑**（手改容易算错坐标）。
#
#  用户第 6 条：竞技场在固定的 lobby 世界里、已由玩家修建完成；
#  插件【不生成新世界】，只记录坐标用于传送玩家与生成生物。
#
#  坐标直接存**绝对坐标**（Q42）：Maggoteers 的「层原点 + 相对坐标」
#  是为了让同一张图复制到多个层原点复用，我们没有那个需求。
#
#  一个竞技场要能开局，必须具备：
#    world          所在世界（通常是 lobby）
#    player-spawn   玩家传送点
#    left-points    左侧 3 个刷怪点（1/2/3）
#    right-points   右侧 3 个刷怪点（1/2/3）
#  （spectate-spawn 观战席可选，但强烈建议配置）
#
#  示例（用指令生成的样子）：
#    arenas:
#      colosseum:
#        world: lobby
#        player-spawn:   { x: 100.5, y: 65.0, z: 200.5, yaw: 0.0, pitch: 0.0 }
#        spectate-spawn: { x: 100.5, y: 78.0, z: 200.5, yaw: 0.0, pitch: 20.0 }
#        left-points:
#          "1": { x: 80.5,  y: 65.0, z: 190.5 }
#          "2": { x: 80.5,  y: 65.0, z: 200.5 }
#          "3": { x: 80.5,  y: 65.0, z: 210.5 }
#        right-points:
#          "1": { x: 120.5, y: 65.0, z: 190.5 }
#          "2": { x: 120.5, y: 65.0, z: 200.5 }
#          "3": { x: 120.5, y: 65.0, z: 210.5 }
# ============================================================

arenas: {}
